# lookback_hours applies to all RSS feeds.
# HN uses its own lookback_hours below.
# seen.json deduplicates across all runs — widening the window does not re-ship.
lookback_hours: 72

rss:
  # ── Tier 1: frontier lab (first-party announcements) ──────────────────────
  - {name: "Anthropic",            url: "https://www.anthropic.com/news/rss.xml",                                         weight: 1.5}
  - {name: "OpenAI",               url: "https://openai.com/news/rss.xml",                                                weight: 1.4}
  - {name: "Google DeepMind",      url: "https://deepmind.google/blog/rss.xml",                                           weight: 1.3}
  - {name: "Microsoft AI Blog",    url: "https://blogs.microsoft.com/ai/feed/",                                           weight: 1.3}
  - {name: "Mistral AI",           url: "https://mistral.ai/news/feed.xml",                                               weight: 1.1}
  - {name: "Meta AI",              url: "https://ai.meta.com/blog/rss/",                                                  weight: 1.0}
  - {name: "NVIDIA Blog",          url: "https://blogs.nvidia.com/feed/",                                                 weight: 1.0}
  - {name: "Hugging Face",         url: "https://huggingface.co/blog/feed.xml",                                           weight: 1.1}

  # ── Tier 2a: practitioner / builder / researcher ──────────────────────────
  - {name: "Latent Space",         url: "https://www.latent.space/feed",                                                  weight: 1.3}
  - {name: "Interconnects",        url: "https://www.interconnects.ai/feed",                                              weight: 1.3}
  - {name: "Semianalysis",         url: "https://www.semianalysis.com/feed",                                              weight: 1.3}
  - {name: "AI News (smol)",       url: "https://buttondown.com/ainews/rss",                                              weight: 1.2}
  - {name: "Simon Willison",       url: "https://simonwillison.net/atom/everything/",                                     weight: 1.2}
  - {name: "Import AI",            url: "https://importai.substack.com/feed",                                             weight: 1.2}
  - {name: "The Batch",            url: "https://www.deeplearning.ai/the-batch/feed/",                                    weight: 1.1}
  - {name: "The Decoder",          url: "https://the-decoder.com/feed/",                                                  weight: 0.9}

  # ── Tier 2b: high-signal individuals ──────────────────────────────────────
  - {name: "Ethan Mollick",        url: "https://www.oneusefulething.com/feed",                                           weight: 1.4}
  - {name: "Andrej Karpathy",      url: "https://karpathy.github.io/feed.xml",                                            weight: 1.4}  # VERIFY: may need updating if he moves platforms
  - {name: "Eugene Yan",           url: "https://eugeneyan.com/feed.xml",                                                 weight: 1.2}
  - {name: "Hamel Husain",         url: "https://hamel.dev/feed.xml",                                                     weight: 1.1}

  # ── Tier 2c: think tanks & research institutes ────────────────────────────
  - {name: "Stanford HAI",         url: "https://hai.stanford.edu/news/rss.xml",                                          weight: 1.2}
  - {name: "a16z",                 url: "https://a16z.com/feed/",                                                         weight: 1.1}
  - {name: "RAND AI",              url: "https://www.rand.org/topics/artificial-intelligence.xml",                         weight: 1.1}  # VERIFY
  - {name: "Brookings AI",         url: "https://www.brookings.edu/topic/artificial-intelligence/feed/",                   weight: 1.0}  # VERIFY
  - {name: "CSET Georgetown",      url: "https://cset.georgetown.edu/feed/",                                               weight: 1.1}

  # ── Tier 3: strategic / business analysis ─────────────────────────────────
  - {name: "Stratechery",          url: "https://stratechery.com/feed/",                                                  weight: 1.4}
  - {name: "MIT Tech Review AI",   url: "https://www.technologyreview.com/topic/artificial-intelligence/feed",            weight: 1.1}
  - {name: "VentureBeat AI",       url: "https://venturebeat.com/category/ai/feed/",                                      weight: 1.0}
  - {name: "TechCrunch AI",        url: "https://techcrunch.com/category/artificial-intelligence/feed/",                  weight: 0.9}
  - {name: "The Verge AI",         url: "https://www.theverge.com/ai-artificial-intelligence/rss/index.xml",              weight: 0.9}
  - {name: "Ars Technica IT",      url: "https://arstechnica.com/information-technology/feed/",                           weight: 0.9}
  - {name: "Wired AI",             url: "https://www.wired.com/feed/tag/ai/latest/rss",                                   weight: 0.9}

# ── Podcast show-notes (citation extraction) ──────────────────────────────────
# fetch.py fetches each episode's full content, extracts all outbound article
# links, resolves their titles, and adds them as individual candidates.
# The show-notes page itself is NOT added as a candidate — only what it cites.
# Keep to ~5 most recent episodes per feed (hardcoded in fetch.py).
podcast_shownotes:
  - name: "Latent Space"
    url: "https://www.latent.space/feed"
    weight: 1.4
  - name: "The AI Daily Brief"
    url: "https://aidailybrief.beehiiv.com/feed"    # VERIFY — Nathaniel Whittemore
    weight: 1.3
  - name: "Everyday AI"
    url: "https://www.everyday-ai.com/rss.xml"      # VERIFY — Jordan Wilson
    weight: 1.3
  - name: "How I AI"
    url: ""                                          # PROVIDE: paste the RSS/podcast feed URL here
    weight: 1.2

hackernews:
  enabled: true
  min_points: 80
  lookback_hours: 24
  keywords:
    - AI
    - LLM
    - GPT
    - Claude
    - Gemini
    - agent
    - agentic
    - Anthropic
    - OpenAI
    - Mistral
    - DeepSeek
    - transformer
    - RAG
    - fine-tuning
    - evaluation
    - benchmark
    - pharma AI
    - drug discovery
    - clinical trial AI
