# Tier 1 — frontier lab primary sources (highest weight; first-party announcements)
# Tier 2 — practitioner/builder commentary (post-training, compute, evals, agents)
# Tier 3 — strategic / business analysis (capital flows, deployment, regulation)
rss:
  # Tier 1: frontier lab
  - {name: "Anthropic",            url: "https://www.anthropic.com/news/rss.xml",                                weight: 1.5}
  - {name: "OpenAI",               url: "https://openai.com/news/rss.xml",                                       weight: 1.4}
  - {name: "Google DeepMind",      url: "https://deepmind.google/blog/rss.xml",                                  weight: 1.3}
  - {name: "Microsoft AI Blog",    url: "https://blogs.microsoft.com/ai/feed/",                                  weight: 1.3}
  - {name: "Mistral AI",           url: "https://mistral.ai/news/feed.xml",                                      weight: 1.1}
  - {name: "Meta AI",              url: "https://ai.meta.com/blog/rss/",                                         weight: 1.0}
  - {name: "NVIDIA Blog",          url: "https://blogs.nvidia.com/feed/",                                        weight: 1.0}
  - {name: "Hugging Face",         url: "https://huggingface.co/blog/feed.xml",                                  weight: 1.1}

  # Tier 2: practitioner / builder
  - {name: "Latent Space",         url: "https://www.latent.space/feed",                                         weight: 1.3}
  - {name: "Interconnects",        url: "https://www.interconnects.ai/feed",                                     weight: 1.3}
  - {name: "Semianalysis",         url: "https://www.semianalysis.com/feed",                                     weight: 1.3}
  - {name: "AI News (smol)",       url: "https://buttondown.com/ainews/rss",                                     weight: 1.2}
  - {name: "Simon Willison",       url: "https://simonwillison.net/atom/everything/",                            weight: 1.2}
  - {name: "Import AI",            url: "https://importai.substack.com/feed",                                    weight: 1.2}
  - {name: "The Batch",            url: "https://www.deeplearning.ai/the-batch/feed/",                           weight: 1.1}
  - {name: "The Decoder",          url: "https://the-decoder.com/feed/",                                         weight: 0.9}

  # Tier 3: strategic / business analysis
  - {name: "Stratechery",          url: "https://stratechery.com/feed/",                                         weight: 1.4}
  - {name: "MIT Tech Review AI",   url: "https://www.technologyreview.com/topic/artificial-intelligence/feed",   weight: 1.1}
  - {name: "VentureBeat AI",       url: "https://venturebeat.com/category/ai/feed/",                             weight: 1.0}
  - {name: "TechCrunch AI",        url: "https://techcrunch.com/category/artificial-intelligence/feed/",         weight: 0.9}
  - {name: "The Verge AI",         url: "https://www.theverge.com/ai-artificial-intelligence/rss/index.xml",     weight: 0.9}
  - {name: "Ars Technica IT",      url: "https://arstechnica.com/information-technology/feed/",                  weight: 0.9}
  - {name: "Wired AI",             url: "https://www.wired.com/feed/tag/ai/latest/rss",                          weight: 0.9}

hackernews:
  enabled: true
  min_points: 80
  lookback_hours: 14
  keywords: ["AI", "LLM", "GPT", "Claude", "Gemini", "agent", "agentic", "Anthropic", "OpenAI", "Mistral", "DeepSeek", "transformer", "RAG", "fine-tuning", "evaluation"]
lookback_hours: 14
